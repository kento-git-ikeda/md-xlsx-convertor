[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "md-xlsx-convertor"
version = "1.0.0"
description = "Convert Excel test specifications to mael Markdown and update existing workbooks."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mael==0.0.3.35",
    "openpyxl==3.1.5",
]

[project.scripts]
md-xlsx-convertor = "md_xlsx_convertor.gui:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
